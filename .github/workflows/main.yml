name: miso-lynx2 CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build main.lynx.bundle
        run: nix develop -c ./reload
      - name: Verify bundle artifact
        run: test -f dist/main.lynx.bundle
